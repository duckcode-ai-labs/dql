site_name: ZLens
site_description: Certified answers on your warehouse. Certified blocks, Apps, end-to-end lineage, and AI answers that cite their sources.
site_url: https://duckcode-ai-labs.github.io/zlens/
repo_url: https://github.com/duckcode-ai-labs/zlens
repo_name: duckcode-ai-labs/zlens
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets

plugins:
  - search
  - redirects:
      # Pages merged into the journey-first docs (October 2026). Keep these
      # forever: external links, the README and published npm READMEs point
      # at the old URLs. The old .md files remain as short "moved" notes for
      # GitHub readers and are excluded from the site below.
      redirect_maps:
        01-quickstart.md: get-started/index.md
        02-concepts.md: get-started/concepts.md
        03-install.md: get-started/install.md
        04-dql-in-5-concepts.md: get-started/concepts.md
        guides/README.md: index.md
        guides/connect-warehouse.md: get-started/connect-database.md
        guides/import-dbt.md: get-started/your-dbt-project.md
        guides/authoring-blocks.md: blocks/block-studio.md
        guides/block-studio.md: blocks/block-studio.md
        guides/mcp.md: agents/index.md
        guides/versioning.md: notebooks/version-and-diff.md
        guides/ask-trace-observability.md: ask/how-it-answered.md
        guides/home-and-following.md: apps/index.md

# Embeds feature clips: {{ clip("<id>") }} on a line of its own.
hooks:
  - scripts/mkdocs/clips.py

extra_css:
  - stylesheets/zlens.css

extra_javascript:
  - javascripts/clips.js

copyright: >-
  <a href="https://duckcode-ai-labs.github.io/zlens/architecture/overview/">Architecture</a> ·
  <a href="https://github.com/duckcode-ai-labs/zlens/blob/main/CONTRIBUTING.md">Contributing</a> ·
  <a href="https://github.com/duckcode-ai-labs/zlens/blob/main/SUPPORT.md">Support</a> ·
  Apache-2.0

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/duckcode-ai-labs/zlens
    - icon: fontawesome/brands/discord
      link: https://discord.gg/Dnm6bUvk

# Internal artifacts kept out of the published site. docs/README.md is the
# github.com landing page for docs/; index.md is the site home. The "moved"
# notes are for GitHub readers only; the redirects above serve the site.
exclude_docs: |
  /README.md
  oss-readiness-checklist.md
  rfcs/0000-template.md
  contribute/
  /01-quickstart.md
  /02-concepts.md
  /03-install.md
  /04-dql-in-5-concepts.md
  guides/README.md
  guides/connect-warehouse.md
  guides/import-dbt.md
  guides/authoring-blocks.md
  guides/block-studio.md
  guides/mcp.md
  guides/versioning.md
  guides/ask-trace-observability.md
  guides/home-and-following.md


# Reason: workflows are protected. Copy to .github/workflows/secret-scan.yml.
# BEFORE USE: replace <GITLEAKS_ACTION_SHA> with the full commit SHA of the gitleaks/gitleaks-action
# release you choose (e.g. `git ls-remote https://github.com/gitleaks/gitleaks-action refs/tags/v2.3.9`).
# I had no network access to look it up, and a guessed SHA is not acceptable.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@<GITLEAKS_ACTION_SHA> # vX.Y.Z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

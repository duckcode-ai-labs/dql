# Reason: workflows are protected. Copy to .github/workflows/secret-scan.yml.
# BEFORE USE:
#  1. Replace <GITLEAKS_ACTION_SHA> with the full commit SHA of the gitleaks/gitleaks-action
#     release you choose (e.g. `git ls-remote https://github.com/gitleaks/gitleaks-action refs/tags/v2.3.9`).
#     I had no network access to look it up, and a guessed SHA is not acceptable.
#  2. OWNER: gitleaks-action v2 needs a GITLEAKS_LICENSE secret for repos owned by an
#     organization (duckcode-ai-labs/dql is one). Get a licence at gitleaks.io and add it as a
#     repository secret. Without it the job fails on its first run.
#  3. Confirm GITLEAKS_VERSION below is a release >= 8.25 (.gitleaks.toml uses [[allowlists]]
#     with `condition`); change it to the release you checked.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@<GITLEAKS_ACTION_SHA> # vX.Y.Z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.25.0

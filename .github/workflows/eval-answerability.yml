name: Answerability (false-refusal gate)

# Publishes the false-refusal / refusal-recall / clarification numbers on every
# PR, driving the REAL runtime so routing, the plan boundary, and the run gates
# are all exercised. `dql agent eval --via loop` calls the answer loop directly
# and skips every one of those — the half where the reported dead ends actually
# live — so a refusal rate measured there reads cleaner than users experience.
#
# BLOCKING, at thresholds taken from a MEASURED baseline — never invented.
# Measured on this fixture, both suites 8/8:
#     false refusal   0%    (0/5 and 0/6 answerable cases)
#     refusal recall  100%  (3/3 and 2/2 must-refuse cases)
#
#   --max-false-refusal 0.05  a small margin over a measured 0%
#   --min-refusal-recall 1    NO margin: this is the guard that stops
#                             "never dead-end" degrading into "always answer",
#                             and one hallucinated answer to an out-of-scope
#                             question is worse than one extra refusal.
#
# Tighten the ceiling in the same PR that improves it. A threshold invented
# before the first run is either permanently red or quietly disabled.
#
# Needs no API key and no cloud warehouse: the runtime starts against the
# committed jaffle fixture. Note that WITHOUT a provider `mayAssumeInterpretation`
# is false (AGT-017) and every ambiguous question clarifies by design, so the
# clarification rate here is an artifact — the report says so itself. Recording
# cassettes (DQL_EVAL_CASSETTE_DIR) is what makes that number meaningful, and
# what will let this job gate on it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  answerability:
    name: answerability (runtime-driven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Seed the eval warehouse
        run: |
          # The fixture's checked-in connection is `:memory:`, which is EMPTY on
          # every connect. This suite was therefore scoring questions against a
          # warehouse with zero tables — every lookup failing as "table does not
          # exist" and being counted as a false refusal. Measured locally: the
          # false-refusal rate reads 0.4 unseeded and 0.0 seeded, on the same
          # eight cases and the same model. The unseeded number was fiction.
          #
          # DuckDB is an intentionally optional connector dependency. Install it
          # only for this disposable seed step, matching the execution-eval
          # workflow; the workspace's frozen pnpm install must stay connector-
          # optional for normal DQL users.
          # npm 10 reads workspace:* dependencies when invoked from the repo
          # root, which makes this optional install fail before it downloads
          # DuckDB. Give npm a disposable non-workspace prefix instead.
          SEED_CONNECTOR_ROOT="$RUNNER_TEMP/answerability-seed-connectors"
          mkdir -p "$SEED_CONNECTOR_ROOT"
          printf '%s\n' '{"private":true}' > "$SEED_CONNECTOR_ROOT/package.json"
          npm --prefix "$SEED_CONNECTOR_ROOT" install --no-save --no-package-lock --workspaces=false duckdb@1.1.3
          # Copy the fixture so the checked-in `:memory:` config is never mutated.
          cp -R apps/cli/test/fixtures/jaffle-supply-chain "$PROJ"
          # The dbt manifest qualifies physical relations as
          # jaffle_shop.dev.<table>. DuckDB derives the catalog from the file
          # name, so use that catalog and seed the matching schema rather than
          # weakening production relation qualification for this disposable DB.
          node scripts/seed-eval-warehouse.mjs --connector-root "$SEED_CONNECTOR_ROOT" --out "$PROJ/jaffle_shop.duckdb" --schema dev
          DQL_TEST_DUCKDB_CONNECTOR_ROOT="$SEED_CONNECTOR_ROOT" node --test scripts/seed-eval-warehouse.test.mjs
          # The project reads `connections.default`, not `defaultConnection`.
          node -e "const fs=require('fs');const p=process.env.PROJ+'/dql.config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.connections={...(c.connections||{}),default:{driver:'duckdb',filepath:process.env.PROJ+'/jaffle_shop.duckdb'}};fs.writeFileSync(p,JSON.stringify(c,null,2));"
          # Fail loudly rather than reporting a green run over an empty database.
          node -e "const fs=require('fs');const f=process.env.PROJ+'/jaffle_shop.duckdb';if(!fs.existsSync(f)||fs.statSync(f).size<1000){console.error('Seeded warehouse missing or empty: '+f);process.exit(1);}console.log('seeded warehouse OK:',fs.statSync(f).size,'bytes');"
        env:
          PROJ: ${{ runner.temp }}/answerability-proj

      - name: Start the runtime against the fixture
        id: runtime
        run: |
          # The project path is REQUIRED: `dql notebook` resolves a project from
          # it, and starting from the workspace root fails with "No DQL project
          # was found". Verified by running this exact sequence locally.
          #
          # Replay against the committed cassettes. A miss is a failure and
          # never reaches a live model, so this stays PR-safe while exercising
          # the provider-dispatch path. The report separately classifies
          # deterministic legacy migrations as orchestration replay only; they
          # are never presented as current-provider quality evidence.
          DQL_EVAL_CASSETTE_DIR="$PROJ/test-cassettes/answerability" \
            node apps/cli/dist/index.js notebook "$PROJ" \
              --port 3479 > runtime.log 2>&1 &
          echo $! > runtime.pid
          for i in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:3479/api/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Runtime did not become healthy:" >&2
          cat runtime.log >&2
          exit 1
        env:
          PROJ: ${{ runner.temp }}/answerability-proj

      - name: Answerability suite
        working-directory: ${{ runner.temp }}/answerability-proj
        env:
          # The runtime owns replay; the eval process receives this only to
          # report cassette provenance without inspecting provider payloads.
          DQL_EVAL_CASSETTE_DIR: ${{ runner.temp }}/answerability-proj/test-cassettes/answerability
        run: |
          # The report is printed whether or not a gate fails: under `bash -e`
          # a failing eval used to end the step before its report was shown.
          status=0
          node "$GITHUB_WORKSPACE/apps/cli/dist/index.js" agent eval agent-evals/answerability.agent-evals.yml \
            --via runtime --runtime-url http://127.0.0.1:3479 \
            --max-false-refusal 0.05 --min-refusal-recall 1 \
            --format json > "$GITHUB_WORKSPACE/answerability-report.json" || status=$?
          cat "$GITHUB_WORKSPACE/answerability-report.json"
          exit "$status"

      - name: Routing taxonomy suite
        # Runs even when the answerability gate failed, so one red run shows
        # both suites. It still fails the job on its own gate.
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/answerability-proj
        env:
          DQL_EVAL_CASSETTE_DIR: ${{ runner.temp }}/answerability-proj/test-cassettes/answerability
        run: |
          status=0
          node "$GITHUB_WORKSPACE/apps/cli/dist/index.js" agent eval agent-evals/routing-taxonomy.agent-evals.yml \
            --via runtime --runtime-url http://127.0.0.1:3479 \
            --max-false-refusal 0.05 --min-refusal-recall 1 \
            --format json > "$GITHUB_WORKSPACE/routing-report.json" || status=$?
          cat "$GITHUB_WORKSPACE/routing-report.json"
          exit "$status"

      - name: Explain failing cases
        # A case's report entry says THAT it refused; the runtime's own run
        # summary says WHY (for example a cassette miss naming the missing
        # key). Print both while the runtime is still up.
        if: ${{ failure() && steps.runtime.outcome == 'success' }}
        run: |
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync } from 'node:fs';
          for (const file of ['answerability-report.json', 'routing-report.json']) {
            if (!existsSync(file)) continue;
            let report;
            try { report = JSON.parse(readFileSync(file, 'utf8')); } catch (error) {
              console.log(`## ${file}: not JSON (${error.message})`);
              continue;
            }
            console.log(`## ${file}: ${report.passed}/${report.total} passed`);
            for (const result of report.results ?? []) {
              console.log(`  ${result.passed ? 'PASS' : 'FAIL'}  ${result.name}`);
              console.log(`        kind=${result.kind} route=${result.route} providerDispatches=${result.providerDispatchCount ?? 'n/a'}`);
              for (const failure of result.failures ?? []) console.log(`        - ${failure}`);
            }
          }
          try {
            const response = await fetch('http://127.0.0.1:3479/api/agent-runs?limit=100', { signal: AbortSignal.timeout(10_000) });
            const { runs = [] } = await response.json();
            console.log(`## runtime runs (${runs.length}, newest first)`);
            for (const run of runs) {
              console.log(`  [${run.status}/${run.route}] ${run.question}`);
              console.log(`        ${String(run.summary ?? '').replace(/\s+/g, ' ').slice(0, 400)}`);
            }
          } catch (error) {
            console.log(`Could not read runs from the runtime: ${error.message}`);
          }
          EOF
          echo "## runtime.log (last 200 lines)"
          tail -n 200 runtime.log || true

      - name: Summarise the headline numbers
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['answerability-report.json', 'routing-report.json']) {
              if (!fs.existsSync(file)) continue;
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              const m = report.metrics ?? {};
              const pct = (v) => (v === null || v === undefined ? 'n/a' : Math.round(v * 100) + '%');
              console.log('## ' + file);
              console.log('  passed:            ' + report.passed + '/' + report.total);
              console.log('  false refusal:     ' + pct(m.false_refusal_rate) + '  (' + m.false_refusal_count + '/' + m.answerable_case_count + ')');
              console.log('  refusal recall:    ' + pct(m.refusal_recall));
              console.log('  clarification:     ' + pct(m.clarification_rate));
              console.log('  meaning resolved:  ' + pct(m.meaning_resolved_rate) + (m.meaning_resolved_rate ? '' : '  <- clarification rate is an artifact without a provider'));
              const cassette = report.cassetteEvidence;
              if (cassette) {
                console.log('  cassette replay:    ' + cassette.totalEntries + ' entry(s), ' + cassette.migratedLegacyDeterministicFixtureEntries + ' migrated legacy deterministic fixture(s), ' + cassette.syntheticDeterministicOrchestrationFixtureEntries + ' synthetic deterministic orchestration fixture(s)');
                console.log('  provider quality:   ' + (cassette.realProviderQualityEligible
                  ? 'eligible recorded-provider evidence'
                  : 'excluded from provider-quality evidence (' + cassette.realProviderQualityExclusionReasons.join(', ') + ')'));
              }
            }
          " >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Stop the runtime
        if: always()
        run: kill "$(cat runtime.pid)" 2>/dev/null || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answerability-reports
          path: |
            answerability-report.json
            routing-report.json
            runtime.log
          if-no-files-found: ignore

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_extension:
        description: Publish the VS Code extension to the Visual Studio Marketplace (manual only)
        type: boolean
        required: false
        default: false

concurrency:
  group: dql-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-packages:
    # `secrets` context isn't allowed in job-level `if:` expressions, so we
    # gate on the repository only. Forks re-using the workflow will hit an
    # auth error at the publish step, which is the right behavior.
    if: github.repository == 'duckcode-ai/dql' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Select npm dist-tag from the release tag
        id: npm_dist_tag
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "$release_version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: node scripts/release-packages.mjs --publish --tag "${{ steps.npm_dist_tag.outputs.tag }}" --expected-version "${GITHUB_REF_NAME#v}"

  package-extension:
    if: github.repository == 'duckcode-ai/dql' && github.event_name == 'workflow_dispatch' && inputs.publish_extension == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dql-language-support build
      - run: pnpm --filter dql-language-support package
      - uses: actions/upload-artifact@v4
        with:
          name: dql-language-support-vsix
          path: apps/vscode-extension/*.vsix
      - if: ${{ env.VSCE_PAT != '' }}
        run: pnpm --filter dql-language-support publish:vsce

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- primary build + unit/golden tests ---
  build-and-test:
    name: build + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        id: build
      # --continue: Turbo otherwise stops every other package's tests at the
      # first failing package, so one failure hides the next. The job still
      # fails if any package fails.
      # DQL_AGENT_TEST_LANE=ordinary: dql-agent runs only its ordinary lane
      # here; its heavy lane runs in the next step (see there).
      - run: pnpm test -- --continue
        env:
          DQL_AGENT_TEST_LANE: ordinary
      # The dql-agent heavy lane (catalog.test.ts, project-state.test.ts)
      # builds 4,000-model indexes and asserts a wall-clock retrieval bound
      # (PERF-001/PERF-002). Inside `pnpm test` it shared the runner with the
      # CLI suite and measured about three times slower, so it runs here on
      # its own, after every other suite has finished. It runs even when the
      # step above failed, so one red run reports both.
      - name: dql-agent heavy lane (alone)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @duckcodeailabs/dql-agent run test:heavy

  # --- create-dql-app smoke test ---
  # Guards the "5 minutes to first dashboard" demo gate.
  scaffold-smoke:
    name: create-dql-app smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node packages/create-dql-app/test/smoke.mjs

  # --- docs: verify every relative markdown link under docs/ resolves ---
  docs:
    name: docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check relative links in docs/
        run: node scripts/check-doc-links.mjs

  # --- dql fmt --check across the repo ---
  # Gates canonical .dql serialization — catches whitespace churn before
  # it reaches main.
  format-check:
    name: dql fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: dql fmt --check
        run: |
          set -e
          shopt -s globstar nullglob
          files=(packages/create-dql-app/templates/**/*.dql apps/cli/test/fixtures/**/*.dql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .dql files to check — skipping"
            exit 0
          fi
          # Kept byte-for-byte on purpose: the committed commerce-pilot App
          # (app-datasets-pilot/apps/commerce-pilot/dashboards/*.dqld) pins
          # this block's sourceRevision, a hash of the file. Reformatting it
          # makes the pilot tests report source drift, so it is skipped here
          # until the App's pinned revisions are regenerated with it.
          pinned=apps/cli/test/fixtures/app-datasets-pilot/domains/commerce/blocks/order-lines-dataset.dql
          for f in "${files[@]}"; do
            if [ "$f" = "$pinned" ]; then
              echo "  - Skipped (sourceRevision pinned by the commerce-pilot App): $f"
              continue
            fi
            node apps/cli/dist/index.js fmt --check "$f"
          done

  # --- Golden answer-routing eval ---
  # CI-safe W4.1 gate: deterministic router eval over certified, generated, and
  # safe-refusal cases. Deeper `dql agent eval --execute` suites can run in
  # credentialed/project CI, but this keeps every PR honest without live AI keys.
  golden-eval:
    name: golden eval (router)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: dql eval golden fixtures
        run: |
          node apps/cli/dist/index.js eval apps/cli/test/fixtures/lineage-app \
            --format json \
            --min-route-accuracy 1 \
            --min-refusal 1 \
            --min-answer-rate 1
          node apps/cli/dist/index.js eval apps/cli/test/fixtures/jaffle-supply-chain \
            --format json \
            --min-route-accuracy 1 \
            --min-refusal 1 \
            --min-answer-rate 1

  # --- 4,000-model stress test (perf gate) ---
  # Gates: cold <30s, warm <2s. See docs/contribute/testing.md.
  stress-test:
    name: stress (4k-model synthetic project)
    runs-on: ubuntu-latest
    # Only run on main branch pushes — expensive.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: generate 4,000-model synthetic dbt project
        run: node scripts/bench/gen-dbt-project.mjs --models 4000 --out /tmp/stress
      - name: run benchmark (gates cold <30s, warm <2s)
        run: DQL_CLI="node $PWD/apps/cli/dist/index.js" node scripts/bench/run-bench.mjs /tmp/stress

  # --- E2E Playwright (notebook happy path) ---
  # Runs the starter-project path in a headless browser. On PRs that don't
  # touch the notebook app, we skip to keep CI fast.
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files, 'apps/dql-notebook')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -F @duckcodeailabs/dql-notebook-app exec playwright install --with-deps chromium
        continue-on-error: true
      - run: pnpm -F @duckcodeailabs/dql-notebook-app test:e2e
        continue-on-error: true  # gate hardens to `false` once the suite lands

  # --- summary gate for branch protection ---
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [build-and-test, scaffold-smoke, docs, format-check, golden-eval]
    steps:
      - run: echo "All required CI gates passed."

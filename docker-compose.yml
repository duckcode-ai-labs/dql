# Convenience compose file for running ZLens in a container.
#
#   export ZLENS_SERVER_TOKEN="$(openssl rand -hex 24)"   # required, see below
#   (the old DQL_* names still work as a fallback for every ZLENS_* setting)
#   docker compose up                 # notebook on http://127.0.0.1:3474
#   docker compose --profile slack up # also start the Slack bot on :3479
#   docker compose --profile ollama up# also start an Ollama daemon on :11434
#
# All ports are mapped to 127.0.0.1 on the host, so nothing else on your
# network can reach the notebook.
#
# Inside the container the notebook binds 0.0.0.0, which ZLens treats as a
# non-loopback binding: it refuses to start without ZLENS_SERVER_TOKEN and
# ZLENS_ALLOWED_ORIGINS, and every /api/ request except /api/health needs the
# token. `docker compose up` prints a link that carries it
# (http://127.0.0.1:3474/#dql_token=...). Open that link once per browser tab.
#
# The `./` mount at /workspace lets this compose file serve either a real ZLens
# project (when dql.config.json is present) or this framework repo. In the
# framework repo case, the container creates an ignored starter project under
# .dql/docker-starter/dql-starter and opens that project automatically.
#
# To try ZLens on a sample dbt project, clone
# https://github.com/duckcode-ai/jaffle-shop-duckdb and run docker compose
# from a ZLens project folder inside it.

services:
  notebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zlens-notebook
    ports:
      - "127.0.0.1:3474:3474"
    volumes:
      - ./:/workspace
    environment:
      ZLENS_HOST: 0.0.0.0
      # Required: set ZLENS_SERVER_TOKEN (or the old DQL_SERVER_TOKEN) to a long
      # random string before docker compose up. Compose cannot require one of two
      # names, so without either the container stops at startup and says so.
      ZLENS_SERVER_TOKEN: ${ZLENS_SERVER_TOKEN:-${DQL_SERVER_TOKEN:-}}
      # Add the origin you browse from if you map a different host port.
      ZLENS_ALLOWED_ORIGINS: ${ZLENS_ALLOWED_ORIGINS:-${DQL_ALLOWED_ORIGINS:-http://127.0.0.1:3474,http://localhost:3474}}
      # Optional credentials. Empty values keep Docker startup smooth; the UI
      # Settings page shows what is configured and provider calls return clear
      # setup errors when a selected provider is missing credentials.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Default reaches a host-local Ollama daemon from Docker Desktop. If you
      # use the Compose ollama profile, the provider also falls back to
      # http://ollama:11434 automatically.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      ZLENS_SLACK_WEBHOOK: ${ZLENS_SLACK_WEBHOOK:-${DQL_SLACK_WEBHOOK:-}}
      ZLENS_SMTP_URL: ${ZLENS_SMTP_URL:-${DQL_SMTP_URL:-}}
      ZLENS_SMTP_FROM: ${ZLENS_SMTP_FROM:-${DQL_SMTP_FROM:-}}
    command: ["zlens", "notebook", "--host", "0.0.0.0", "--no-open"]

  slack:
    profiles: [slack]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zlens-slack
    ports:
      - "127.0.0.1:3479:3479"
    volumes:
      - ./:/workspace
    environment:
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    command: ["zlens", "slack", "serve", "--port", "3479"]

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: zlens-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # First run will be slow — the base model has to download.
    command: ["serve"]

volumes:
  ollama-data:
